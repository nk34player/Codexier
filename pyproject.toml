[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codexier"
version = "1.1.0"
description = "Interactive Codex provider and model catalog manager"
requires-python = ">=3.11"
dependencies = [
  "rich>=13,<14",
  "tomli-w>=1.0,<2",
  "httpx>=0.27,<1",
  "textual>=0.80,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
codexier = "codexier.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["codexier*"]
